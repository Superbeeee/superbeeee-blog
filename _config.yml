# Site
title: Superbeeee
subtitle: 前端工程師 × 馬拉松跑者
description: 技術、跑步、跑鞋的個人分享
keywords: 前端工程師, Vue.js, 馬拉松, 跑鞋, CSM, 轉職, On Running
author: Eason Tang
language: zh-TW
timezone: Asia/Taipei

# URL
url: https://superbeeee.com
permalink: post/:year/:month/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Writing
new_post_name: :title.md
default_layout: post
external_link:
  enable: true
post_asset_folder: true
marked:
  prependRoot: true
  postAsset: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  wrap: true
  theme: atom-one-light

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 未分類

# Date format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Theme
theme: next

# Search
search:
  path: search.xml
  field: post
  content: true
  format: html

# Feed
feed:
  type: atom
  path: atom.xml
  limit: 20

# Sitemap
sitemap:
  path: sitemap.xml
